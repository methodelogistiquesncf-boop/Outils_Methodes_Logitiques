<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outils & Méthodes Logistiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 8px 12px -2px rgba(0, 0, 0, 0.08);
      --drag-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto 32px auto;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      flex-grow: 1;
    }

    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 12px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--card-bg);
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .btn-reset {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }

    .btn-reset:hover {
      background: var(--bg-color);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .btn-reset svg {
      width: 16px;
      height: 16px;
    }

    /* Grid - 6 colonnes */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-left: 3px solid var(--card-color, var(--accent));
      box-shadow: var(--shadow);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.2s ease, 
                  opacity 0.2s ease,
                  border-color 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
      cursor: grab;
      user-select: none;
    }

    .card:active {
      cursor: grabbing;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: transparent;
    }

    .card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
      box-shadow: var(--drag-shadow);
      border: 2px dashed var(--accent);
      cursor: grabbing;
    }

    .drag-handle {
      position: absolute;
      top: 8px;
      right: 8px;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .card:hover .drag-handle {
      opacity: 0.5;
    }

    .drag-handle svg {
      width: 14px;
      height: 14px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      padding-right: 20px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: color-mix(in srgb, var(--card-color, var(--accent)) 12%, white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .card-icon .fallback-icon {
      font-size: 16px;
      font-weight: 700;
      color: var(--card-color, var(--accent));
    }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: var(--bg-color);
      color: var(--text-primary);
    }

    .btn-action.delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fecaca;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal h2 {
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-color); }

    .btn-primary {
      background: var(--text-primary);
      color: white;
    }
    .btn-primary:hover { background: var(--accent); }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card-actions { opacity: 1; }
      .card { cursor: default; }
      .drag-handle { display: none; }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1.5rem; }
      .toolbar { flex-direction: column; }
      .btn-reset { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛠️ Outils & Méthodes Logistiques</h1>
      <p>Tous les outils du service, réunis au même endroit.</p>
    </header>

    <div class="toolbar">
      <div class="search-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un outil...">
      </div>
      <button class="btn-reset" id="resetOrderBtn" title="Réinitialiser l'ordre personnalisé">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Réinitialiser
      </button>
    </div>

    <div class="grid" id="grid">
      <div class="loading">Chargement des outils...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Ajouter un outil</h2>
      <form id="cardForm">
        <input type="hidden" id="fId">
        <div class="form-group">
          <label for="fName">Nom de l'outil *</label>
          <input type="text" id="fName" required placeholder="Ex: Pilotage M00">
        </div>
        <div class="form-group">
          <label for="fUrl">Lien (URL)</label>
          <input type="url" id="fUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="fDesc">Description courte</label>
          <textarea id="fDesc" rows="3" placeholder="À quoi sert cet outil ?"></textarea>
        </div>
        <div class="form-group">
          <label for="fIcon">URL de l'icône (optionnel)</label>
          <input type="url" id="fIcon" placeholder="https://raw.githubusercontent.com/...">
        </div>
        <div class="form-group">
          <label for="fColor">Couleur d'accentuation</label>
          <input type="color" id="fColor" value="#3b82f6" style="height: 40px; padding: 4px; width: 100%;">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Annuler</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GH_OWNER = 'methodelogistiquesncf-boop';
    const GH_REPO = 'Outils_Methodes_Logitiques';
    const GH_PATH = 'data.json';
    const GH_BRANCH = 'main';
    const STORAGE_KEY = `tools_order_${GH_OWNER}_${GH_REPO}`;
    
    let cards = [];
    let currentSha = null;
    let search = '';
    let draggedId = null;
    let isDragging = false;

    const fallbackData = [
      { "id": "cjlbumrvc", "name": "Complet Conforme", "url": "https://methodelogistiquesncf-boop.github.io/completconforme/", "desc": "Contrôlez la conformité et validez l'exhaustivité de vos kits lors de la préparation.", "cat": "Qualité", "color": "#4caf7d", "icon": "https://raw.githubusercontent.com/methodelogistiquesncf-boop/completconforme/main/icons/icon-192x192.png" },
      { "id": "c1351ehqa", "name": "Création logigramme", "url": "https://methodelogistiquesncf-boop.github.io/Cr-ation_logigramme/", "desc": "Créez, modélisez et cartographiez facilement vos processus et logigrammes métiers.", "cat": "Outils perso", "color": "#9b8ee0" },
      { "id": "cfmyjgloo", "name": "Correcteur", "url": "https://methodelogistiquesncf-boop.github.io/Correcteurs/", "desc": "Vérifiez et corrigez instantanément l'orthographe et la grammaire de vos textes professionnels.", "cat": "Outils perso", "color": "#5b8dd6" },
      { "id": "ccllojnqq", "name": "Pilotage M00", "url": "https://methodelogistiquesncf-boop.github.io/PilotageM00/login.html", "desc": "Suivez l'état d'avancement de vos kits et pilotez les manquants d'approvisionnement.", "cat": "Pilotage", "color": "#5b8dd6" },
      { "id": "cnnp5yjim", "name": "Gestion contenants", "url": "https://methodelogistiquesncf-boop.github.io/Gestion_des_contenants/", "desc": "Suivez, inventoriez et localisez l'ensemble de vos contenants (bois, métalliques, etc.).", "color": "#f59e0b" },
      { "id": "cx4iri0n9", "name": "Demandes Popups", "url": "https://methodelogistiquesncf-boop.github.io/demande_popup/", "desc": "Centralisez, modifiez et suivez l'état d'avancement de toutes vos demandes de popups dans Reflex", "color": "#ec4899" },
      { "id": "cabve2poj", "name": "Pilotage Projet", "url": "https://mikefri.github.io/Pilotage_Projet/", "desc": "Planifiez, pilotez et coordonnez l'ensemble des projets collaboratifs au sein de l'équipe.", "color": "#8b5cf6" },
      { "id": "c5xte4ap1", "name": "Ticket_GLPI MCO", "url": "https://mikefri.github.io/Ticket_GLPI/login.html", "desc": "Déclarez, suivez et traitez l'ensemble des demandes d'assistance auprès de l'équipe MCO.", "color": "#ef4444" },
      { "id": "cdjnyyxd5", "name": "Générateur codes-barres & QR", "url": "https://mikefri.github.io/GenCodeBarre/", "desc": "Générez instantanément vos codes-barres et QR codes pour vos besoins.", "color": "#10b981" },
      { "id": "c2fzlxs7n", "name": "Planning Congés", "url": "https://mikefri.github.io/mes_conges/", "desc": "Gérez et visualisez en un coup d'œil le planning des congés individuels et collectifs.", "color": "#06b6d4" },
      { "id": "c2fzlxs7v", "name": "Météo", "url": "https://mikefri-studio.github.io/Plein_Ciel/", "desc": "Service de prévisions météorologiques couvrant la France métropolitaine et les Outre-Mer. Recherche par ville, département ou région, météo en direct, prévisions détaillées sur 15 jours et navigation", "color": "#3b82f6" },
      { "id": "c2fzlxs7Z", "name": "Planning Activités", "url": "https://methodelogistiquesncf-boop.github.io/Charge_Capa_equipe/", "desc": "Charge / Capacité — Équipe Performance & Méthodes logistique", "color": "#f97316" },
      { "id": "c2fz1xs7Z", "name": "Accueil des nouveaux arrivants", "url": "https://methodelogistiquesncf-boop.github.io/Accueil_des_nouveaux_arrivants/", "desc": "Plateforme d'accueil dédiée aux nouveaux arrivants. Cet outil permet de suivre une checklist des démarches à effectuer avant l'arrivée du collaborateur et d'établir un planning structuré pour sa première semaine.", "color": "#84cc16" }
    ];

    const makeId = () => 'c' + Math.random().toString(36).substr(2, 9);
    const escapeHtml = (unsafe) => {
      if (!unsafe) return '';
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    };
    const getDomain = (url) => {
      try { return new URL(url).hostname; } catch (e) { return null; }
    };

    function loadOrder() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : null;
      } catch (e) {
        return null;
      }
    }

    function saveOrder(order) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(order));
      } catch (e) {
        console.warn('Impossible de sauvegarder l\'ordre en localStorage', e);
      }
    }

    function clearOrder() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function applyCustomOrder() {
      const savedOrder = loadOrder();
      if (!savedOrder || !Array.isArray(savedOrder)) return;

      const cardMap = new Map(cards.map(c => [c.id, c]));
      const ordered = [];
      const seen = new Set();
      
      for (const id of savedOrder) {
        if (cardMap.has(id)) {
          ordered.push(cardMap.get(id));
          seen.add(id);
        }
      }
      
      for (const card of cards) {
        if (!seen.has(card.id)) {
          ordered.push(card);
        }
      }
      
      cards = ordered;
    }

    function updateOrderAfterDrag() {
      const grid = document.getElementById('grid');
      const cardElements = grid.querySelectorAll('.card');
      const newOrder = Array.from(cardElements).map(el => el.dataset.id);
      saveOrder(newOrder);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function render() {
      const grid = document.getElementById('grid');
      const filtered = cards.filter(c => 
        !search || (c.name + ' ' + (c.desc || '')).toLowerCase().includes(search.toLowerCase())
      );

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <h3>Aucun outil trouvé</h3>
            <p>Essayez avec d'autres mots-clés.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const urlSafe = c.url && c.url.trim() ? c.url.trim() : null;
        const tag = urlSafe ? 'a' : 'div';
        const hrefAttrs = urlSafe ? `href="${escapeHtml(urlSafe)}" target="_blank" rel="noopener"` : '';
        const color = c.color || '#3b82f6';
        
        // Logique d'affichage des icônes avec 3 niveaux de fallback
        let iconHtml = '';
        
        if (c.icon && c.icon.trim()) {
          // Priorité 1 : Icône personnalisée du JSON
          iconHtml = `<img src="${escapeHtml(c.icon)}" alt="icon" 
                      onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                      <span class="fallback-icon" style="display:none;">${c.name.charAt(0).toUpperCase()}</span>`;
        } else if (urlSafe) {
          // Priorité 2 : Favicon automatique du site
          const domain = getDomain(urlSafe);
          if (domain) {
            iconHtml = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" alt="icon" 
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <span class="fallback-icon" style="display:none;">${c.name.charAt(0).toUpperCase()}</span>`;
          } else {
            iconHtml = `<span class="fallback-icon">${c.name.charAt(0).toUpperCase()}</span>`;
          }
        } else {
          // Priorité 3 : Juste la première lettre
          iconHtml = `<span class="fallback-icon">${c.name.charAt(0).toUpperCase()}</span>`;
        }

        return `
        <${tag} class="card" 
              style="--card-color: ${color};" 
              ${hrefAttrs} 
              data-id="${c.id}"
              draggable="true"
              title="${urlSafe ? 'Ouvrir ' + escapeHtml(c.name) : 'Pas de lien renseigné'}">
          <div class="drag-handle" title="Glisser pour réorganiser">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16" />
            </svg>
          </div>
          <div class="card-header">
            <div class="card-icon">
              ${iconHtml}
            </div>
            <h3>${escapeHtml(c.name)}</h3>
          </div>
          <p>${escapeHtml(c.desc || 'Aucune description.')}</p>
          <div class="card-actions">
            <button type="button" class="btn-action" onclick="event.preventDefault(); openModal('${c.id}')" title="Modifier">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button type="button" class="btn-action delete" onclick="event.preventDefault(); deleteCard('${c.id}')" title="Supprimer">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </${tag}>`;
      }).join('');

      attachDragEvents();
    }

    function attachDragEvents() {
      const cardsElements = document.querySelectorAll('.card');
      
      cardsElements.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          draggedId = card.dataset.id;
          isDragging = true;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', draggedId);
          setTimeout(() => {
            card.style.opacity = '0.4';
          }, 0);
        });

        card.addEventListener('dragend', (e) => {
          card.classList.remove('dragging');
          card.style.opacity = '';
          draggedId = null;
          setTimeout(() => {
            isDragging = false;
          }, 100);
          updateOrderAfterDrag();
        });

        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          
          if (!draggedId || card.dataset.id === draggedId) return;
          
          const grid = document.getElementById('grid');
          const draggingEl = grid.querySelector(`[data-id="${draggedId}"]`);
          if (!draggingEl) return;
          
          const rect = card.getBoundingClientRect();
          const midpoint = rect.left + rect.width / 2;
          
          if (e.clientX < midpoint) {
            grid.insertBefore(draggingEl, card);
          } else {
            grid.insertBefore(draggingEl, card.nextSibling);
          }
        });

        if (card.tagName === 'A') {
          card.addEventListener('click', (e) => {
            if (isDragging) {
              e.preventDefault();
              e.stopPropagation();
            }
          });
        }
      });
    }

    async function loadData() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`);
        if (!res.ok) throw new Error('Fichier non trouvé');
        const data = await res.json();
        currentSha = data.sha;
        
        const binaryString = atob(data.content);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const content = new TextDecoder('utf-8').decode(bytes);
        
        cards = JSON.parse(content);
      } catch (err) {
        console.warn('Chargement GitHub échoué, utilisation des données locales.', err);
        cards = fallbackData;
      }
      
      applyCustomOrder();
      render();
    }

    async function saveToGitHub() {
      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerText;
      btn.innerText = 'Sauvegarde...';
      btn.disabled = true;

      try {
        if (!currentSha) {
          const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`);
          if (res.ok) {
            const data = await res.json();
            currentSha = data.sha;
          }
        }

        let token = sessionStorage.getItem('gh_token');
        if (!token) {
          token = prompt("Pour sauvegarder sur GitHub, veuillez entrer votre Personal Access Token (PAT) avec le scope 'repo' :");
          if (!token) throw new Error("Annulé par l'utilisateur");
          sessionStorage.setItem('gh_token', token);
        }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
        
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "chore: mise à jour des outils",
            content: content,
            sha: currentSha,
            branch: GH_BRANCH
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || 'Erreur lors de la sauvegarde');
        }

        const newData = await res.json();
        currentSha = newData.content.sha;
        
        closeModal();
        showToast('✅ Enregistré sur GitHub !');
      } catch (err) {
        alert('❌ Erreur : ' + err.message);
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const cardForm = document.getElementById('cardForm');

    function openModal(id = null) {
      document.getElementById('modalTitle').innerText = id ? 'Modifier l\'outil' : 'Ajouter un outil';
      if (id) {
        const card = cards.find(c => c.id === id);
        document.getElementById('fId').value = card.id;
        document.getElementById('fName').value = card.name;
        document.getElementById('fUrl').value = card.url || '';
        document.getElementById('fDesc').value = card.desc || '';
        document.getElementById('fIcon').value = card.icon || '';
        document.getElementById('fColor').value = card.color || '#3b82f6';
      } else {
        cardForm.reset();
        document.getElementById('fId').value = '';
        document.getElementById('fColor').value = '#3b82f6';
      }
      modalOverlay.classList.add('active');
      document.getElementById('fName').focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function deleteCard(id) {
      if (confirm('Supprimer cet outil ?')) {
        cards = cards.filter(c => c.id !== id);
        render();
        saveToGitHub();
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      search = e.target.value;
      render();
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.getElementById('resetOrderBtn').addEventListener('click', () => {
      if (confirm('Réinitialiser l\'ordre personnalisé ? Les outils reprendront leur ordre par défaut.')) {
        clearOrder();
        loadData();
        showToast('🔄 Ordre réinitialisé');
      }
    });

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('fId').value;
      const newCard = {
        id: id || makeId(),
        name: document.getElementById('fName').value.trim(),
        url: document.getElementById('fUrl').value.trim(),
        desc: document.getElementById('fDesc').value.trim(),
        icon: document.getElementById('fIcon').value.trim(),
        color: document.getElementById('fColor').value
      };

      if (id) {
        const index = cards.findIndex(c => c.id === id);
        cards[index] = { ...cards[index], ...newCard };
      } else {
        cards.push(newCard);
      }

      render();
      saveToGitHub();
    });

    loadData();
  </script>
</body>
</html>
