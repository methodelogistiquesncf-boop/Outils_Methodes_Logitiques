<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outils & Méthodes Logistiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 8px 12px -2px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1800px; /* Élargi pour accueillir 6 colonnes confortablement */
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Search Bar */
    .search-wrapper {
      position: relative;
      max-width: 500px;
      margin: 0 auto 32px auto;
    }

    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 12px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--card-bg);
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Grid - 6 colonnes par défaut */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }

    /* Card - Version compacte */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-left: 3px solid var(--card-color, var(--accent));
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: transparent;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: color-mix(in srgb, var(--card-color, var(--accent)) 12%, white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .card-icon img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .card-icon .fallback-icon {
      font-size: 16px;
      font-weight: 700;
      color: var(--card-color, var(--accent));
    }

    .card h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      /* Limite à 2 lignes max pour garder les cartes basses */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.4;
      flex-grow: 1;
      /* Limite à 3 lignes max pour éviter l'étirement */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: var(--bg-color);
      color: var(--text-primary);
    }

    .btn-action.delete:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fecaca;
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal h2 {
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover { background: var(--bg-color); }

    .btn-primary {
      background: var(--text-primary);
      color: white;
    }
    .btn-primary:hover { background: var(--accent); }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    /* --- RESPONSIVE --- */
    /* Grand écran : 6 colonnes (défaut) */
    
    /* Écran moyen (laptop 13-14") : 4 colonnes */
    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    
    /* Tablette paysage : 3 colonnes */
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    
    /* Tablette portrait / Petit écran : 2 colonnes */
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card-actions { opacity: 1; } /* Toujours visible sur mobile */
    }
    
    /* Mobile : 1 colonne */
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛠️ Outils & Méthodes Logistiques</h1>
      <p>Tous les outils du service, réunis au même endroit.</p>
    </header>

    <div class="search-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un outil...">
    </div>

    <div class="grid" id="grid">
      <div class="loading">Chargement des outils...</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Ajouter un outil</h2>
      <form id="cardForm">
        <input type="hidden" id="fId">
        <div class="form-group">
          <label for="fName">Nom de l'outil *</label>
          <input type="text" id="fName" required placeholder="Ex: Pilotage M00">
        </div>
        <div class="form-group">
          <label for="fUrl">Lien (URL)</label>
          <input type="url" id="fUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="fDesc">Description courte</label>
          <textarea id="fDesc" rows="3" placeholder="À quoi sert cet outil ?"></textarea>
        </div>
        <div class="form-group">
          <label for="fColor">Couleur d'accentuation</label>
          <input type="color" id="fColor" value="#3b82f6" style="height: 40px; padding: 4px; width: 100%;">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Annuler</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- Configuration GitHub ---
    const GH_OWNER = 'methodelogistiquesncf-boop';
    const GH_REPO = 'Outils_Methodes_Logitiques';
    const GH_PATH = 'data.json';
    const GH_BRANCH = 'main';
    
    // --- État ---
    let cards = [];
    let currentSha = null;
    let search = '';

    // --- Données de secours ---
    const fallbackData = [
      { "id": "cjlbumrvc", "name": "Complet Conforme", "url": "https://methodelogistiquesncf-boop.github.io/completconforme/", "desc": "Contrôlez la conformité et validez l'exhaustivité de vos kits lors de la préparation.", "cat": "Qualité", "color": "#4caf7d" },
      { "id": "c1351ehqa", "name": "Création logigramme", "url": "https://methodelogistiquesncf-boop.github.io/Cr-ation_logigramme/", "desc": "Créez, modélisez et cartographiez facilement vos processus et logigrammes métiers.", "cat": "Outils perso", "color": "#9b8ee0" },
      { "id": "cfmyjgloo", "name": "Correcteur", "url": "https://methodelogistiquesncf-boop.github.io/Correcteurs/", "desc": "Vérifiez et corrigez instantanément l'orthographe et la grammaire de vos textes professionnels.", "cat": "Outils perso", "color": "#5b8dd6" },
      { "id": "ccllojnqq", "name": "Pilotage M00", "url": "https://methodelogistiquesncf-boop.github.io/PilotageM00/login.html", "desc": "Suivez l'état d'avancement de vos kits et pilotez les manquants d'approvisionnement.", "cat": "Pilotage", "color": "#5b8dd6" },
      { "id": "cnnp5yjim", "name": "Gestion contenants", "url": "https://methodelogistiquesncf-boop.github.io/Gestion_des_contenants/", "desc": "Suivez, inventoriez et localisez l'ensemble de vos contenants (bois, métalliques, etc.).", "color": "#f59e0b" },
      { "id": "cx4iri0n9", "name": "Demandes Popups", "url": "https://methodelogistiquesncf-boop.github.io/demande_popup/", "desc": "Centralisez, modifiez et suivez l'état d'avancement de toutes vos demandes de popups dans Reflex", "color": "#ec4899" },
      { "id": "cabve2poj", "name": "Pilotage Projet", "url": "https://mikefri.github.io/Pilotage_Projet/", "desc": "Planifiez, pilotez et coordonnez l'ensemble des projets collaboratifs au sein de l'équipe.", "color": "#8b5cf6" },
      { "id": "c5xte4ap1", "name": "Ticket_GLPI MCO", "url": "https://mikefri.github.io/Ticket_GLPI/login.html", "desc": "Déclarez, suivez et traitez l'ensemble des demandes d'assistance auprès de l'équipe MCO.", "color": "#ef4444" },
      { "id": "cdjnyyxd5", "name": "Générateur codes-barres & QR", "url": "https://mikefri.github.io/GenCodeBarre/", "desc": "Générez instantanément vos codes-barres et QR codes pour vos besoins.", "color": "#10b981" },
      { "id": "c2fzlxs7n", "name": "Planning Congés", "url": "https://mikefri.github.io/mes_conges/", "desc": "Gérez et visualisez en un coup d'œil le planning des congés individuels et collectifs.", "color": "#06b6d4" },
      { "id": "c2fzlxs7v", "name": "Meteo", "url": "https://mikefri-studio.github.io/Plein_Ciel/", "desc": "Service de prévisions météorologiques couvrant la France métropolitaine et les Outre-Mer.", "color": "#3b82f6" },
      { "id": "c2fzlxs7Z", "name": "Planning Activités", "url": "https://methodelogistiquesncf-boop.github.io/Charge_Capa_equipe/", "desc": "Charge / Capacité — Équipe Performance & Méthodes logistique", "color": "#f97316" },
      { "id": "c2fz1xs7Z", "name": "Accueil des nouveaux arrivants", "url": "https://methodelogistiquesncf-boop.github.io/Accueil_des_nouveaux_arrivants/", "desc": "Plateforme d'accueil dédiée aux nouveaux arrivants. Checklist et planning de la première semaine.", "color": "#84cc16" }
    ];

    // --- Fonctions Utilitaires ---
    const makeId = () => 'c' + Math.random().toString(36).substr(2, 9);
    const escapeHtml = (unsafe) => {
      if (!unsafe) return '';
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    };

    const getDomain = (url) => {
      try {
        return new URL(url).hostname;
      } catch (e) {
        return null;
      }
    };

    // --- Rendu ---
    function render() {
      const grid = document.getElementById('grid');
      const filtered = cards.filter(c => 
        !search || (c.name + ' ' + (c.desc || '')).toLowerCase().includes(search.toLowerCase())
      );

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <h3>Aucun outil trouvé</h3>
            <p>Essayez avec d'autres mots-clés.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const urlSafe = c.url && c.url.trim() ? c.url.trim() : null;
        const tag = urlSafe ? 'a' : 'div';
        const hrefAttrs = urlSafe ? `href="${escapeHtml(urlSafe)}" target="_blank" rel="noopener"` : '';
        const color = c.color || '#3b82f6';
        
        const domain = getDomain(urlSafe);
        let iconHtml = '';
        if (domain) {
          iconHtml = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" alt="icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                      <span class="fallback-icon" style="display:none;">${c.name.charAt(0).toUpperCase()}</span>`;
        } else {
          iconHtml = `<span class="fallback-icon">${c.name.charAt(0).toUpperCase()}</span>`;
        }

        return `
        <${tag} class="card" style="--card-color: ${color};" ${hrefAttrs} title="${urlSafe ? 'Ouvrir ' + escapeHtml(c.name) : 'Pas de lien renseigné'}">
          <div class="card-header">
            <div class="card-icon">
              ${iconHtml}
            </div>
            <h3>${escapeHtml(c.name)}</h3>
          </div>
          <p>${escapeHtml(c.desc || 'Aucune description.')}</p>
          <div class="card-actions">
            <button type="button" class="btn-action" onclick="event.preventDefault(); openModal('${c.id}')" title="Modifier">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button type="button" class="btn-action delete" onclick="event.preventDefault(); deleteCard('${c.id}')" title="Supprimer">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        </${tag}>`;
      }).join('');
    }

    // --- GitHub API ---
    async function loadData() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`);
        if (!res.ok) throw new Error('Fichier non trouvé');
        const data = await res.json();
        currentSha = data.sha;
        const content = atob(data.content);
        cards = JSON.parse(content);
      } catch (err) {
        console.warn('Chargement GitHub échoué, utilisation des données locales.', err);
        cards = fallbackData;
      }
      render();
    }

    async function saveToGitHub() {
      const btn = document.getElementById('saveBtn');
      const originalText = btn.innerText;
      btn.innerText = 'Sauvegarde...';
      btn.disabled = true;

      try {
        if (!currentSha) {
          const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`);
          if (res.ok) {
            const data = await res.json();
            currentSha = data.sha;
          }
        }

        let token = sessionStorage.getItem('gh_token');
        if (!token) {
          token = prompt("Pour sauvegarder sur GitHub, veuillez entrer votre Personal Access Token (PAT) avec le scope 'repo' :");
          if (!token) throw new Error("Annulé par l'utilisateur");
          sessionStorage.setItem('gh_token', token);
        }

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(cards, null, 2))));
        
        const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "chore: mise à jour des outils",
            content: content,
            sha: currentSha,
            branch: GH_BRANCH
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || 'Erreur lors de la sauvegarde');
        }

        const newData = await res.json();
        currentSha = newData.content.sha;
        
        closeModal();
        alert('✅ Enregistré !');
      } catch (err) {
        alert('❌ Erreur : ' + err.message);
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    // --- Gestion du Modal ---
    const modalOverlay = document.getElementById('modalOverlay');
    const cardForm = document.getElementById('cardForm');

    function openModal(id = null) {
      document.getElementById('modalTitle').innerText = id ? 'Modifier l\'outil' : 'Ajouter un outil';
      if (id) {
        const card = cards.find(c => c.id === id);
        document.getElementById('fId').value = card.id;
        document.getElementById('fName').value = card.name;
        document.getElementById('fUrl').value = card.url || '';
        document.getElementById('fDesc').value = card.desc || '';
        document.getElementById('fColor').value = card.color || '#3b82f6';
      } else {
        cardForm.reset();
        document.getElementById('fId').value = '';
        document.getElementById('fColor').value = '#3b82f6';
      }
      modalOverlay.classList.add('active');
      document.getElementById('fName').focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    function deleteCard(id) {
      if (confirm('Supprimer cet outil ?')) {
        cards = cards.filter(c => c.id !== id);
        render();
        saveToGitHub();
      }
    }

    // --- Événements ---
    document.getElementById('searchInput').addEventListener('input', (e) => {
      search = e.target.value;
      render();
    });

    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    cardForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('fId').value;
      const newCard = {
        id: id || makeId(),
        name: document.getElementById('fName').value.trim(),
        url: document.getElementById('fUrl').value.trim(),
        desc: document.getElementById('fDesc').value.trim(),
        color: document.getElementById('fColor').value
      };

      if (id) {
        const index = cards.findIndex(c => c.id === id);
        cards[index] = { ...cards[index], ...newCard };
      } else {
        cards.push(newCard);
      }

      render();
      saveToGitHub();
    });

    // --- Initialisation ---
    loadData();
  </script>
</body>
</html>
